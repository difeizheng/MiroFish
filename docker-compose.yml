services:
  mirofish:
    # 本地自建镜像（源码构建，含全部本地补丁 + CPU torch，1.8GB vs 官方 8.9GB）
    # 构建：docker build -t mirofish:local .
    # 回退官方镜像：ghcr.nju.edu.cn/666ghj/mirofish:latest
    image: mirofish:local
    container_name: mirofish
    env_file:
      - .env
    environment:
      # 中国时区（容器内默认 UTC，日志/任务时间会差 8 小时）
      TZ: Asia/Shanghai
      # HuggingFace 国内镜像（OASIS 会下载 twhin-bert 模型，直连 HF 会被墙到几乎不动）
      HF_ENDPOINT: https://hf-mirror.com
    ports:
      - "3020:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      # 挂载 .env 使 config_api 热更新能持久化到宿主机（容器内无 .env，env_file 只注入环境变量）
      - ./.env:/app/.env
      # 持久化 HuggingFace 模型缓存，避免容器重建后重新下载 1.1GB 模型
      - ./backend/hf-cache:/root/.cache/huggingface
      # 注意：docker-patches/ 的单文件挂载已全部移除——所有补丁已回填本地源码并打入
      # mirofish:local 镜像（docker-patches/ 仅作历史留档，见其 README）。